<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <title>Jinx Dokumentenchat – Beispielansicht mit fiktiven Demo-Daten</title>
  <rect x="0.5" y="0.5" width="799" height="519" rx="14" fill="#ffffff" stroke="#dde3ec"/>
  <path d="M14 0.5h772a13.5 13.5 0 0 1 13.5 13.5v26h-799v-26A13.5 13.5 0 0 1 14 0.5z" fill="#f3f6fb"/>
  <circle cx="24" cy="20" r="5" fill="#e5675b"/><circle cx="42" cy="20" r="5" fill="#e8b84a"/><circle cx="60" cy="20" r="5" fill="#5cb85c"/>
  <rect x="250" y="10" width="300" height="20" rx="10" fill="#ffffff" stroke="#dde3ec"/>
  <text x="400" y="24" font-size="11" fill="#556070" text-anchor="middle">jinx · Dokumentenchat</text>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#dde3ec"/>
  <rect x="0" y="40.5" width="180" height="479" fill="#f8fafd"/>
  <text x="20" y="72" font-size="15" font-weight="700" fill="#1f5fd1">Jinx</text>
  <text x="20" y="108" font-size="12" fill="#556070">Suche</text>
  <rect x="10" y="122" width="160" height="28" rx="6" fill="#e6eefc"/>
  <text x="20" y="140" font-size="12" font-weight="600" fill="#1f5fd1">Dokumentenchat</text>
  <text x="20" y="172" font-size="12" fill="#556070">Ablage</text>
  <text x="20" y="204" font-size="12" fill="#556070">Duplikate</text>
  <text x="20" y="236" font-size="12" fill="#556070">Einstellungen</text>
  <line x1="180" y1="40" x2="180" y2="520" stroke="#dde3ec"/>
  <rect x="420" y="70" width="350" height="44" rx="12" fill="#1f5fd1"/>
  <text x="438" y="97" font-size="13" fill="#ffffff">Wann endet der Mietvertrag für unser Büro?</text>
  <rect x="210" y="134" width="490" height="250" rx="12" fill="#f3f6fb"/>
  <text x="230" y="164" font-size="13" fill="#1b2430">Der Mietvertrag für das Büro in der Beispielstraße 12 endet</text>
  <text x="230" y="184" font-size="13" fill="#1b2430">am <tspan font-weight="700">31.12.2027</tspan>. Die Kündigungsfrist beträgt <tspan font-weight="700">6 Monate</tspan>.</text>
  <text x="230" y="216" font-size="11" font-weight="600" fill="#556070">QUELLEN</text>
  <rect x="230" y="226" width="250" height="26" rx="6" fill="#ffffff" stroke="#dde3ec"/>
  <text x="242" y="243" font-size="11.5" fill="#1f5fd1">Mietvertrag_Buero_2024.pdf · S. 3</text>
  <rect x="488" y="226" width="204" height="26" rx="6" fill="#ffffff" stroke="#dde3ec"/>
  <text x="499" y="243" font-size="11.5" fill="#1f5fd1">Mietvertrag_Buero_2024.pdf · S. 7</text>
  <rect x="230" y="264" width="450" height="56" rx="6" fill="#ffffff" stroke="#dde3ec"/>
  <text x="242" y="284" font-size="11.5" fill="#556070" font-style="italic">„Das Mietverhältnis endet am 31.12.2027, sofern es nicht</text>
  <text x="242" y="302" font-size="11.5" fill="#556070" font-style="italic">unter Einhaltung einer Frist von sechs Monaten …“</text>
  <rect x="230" y="330" width="450" height="40" rx="6" fill="#fff4d6"/>
  <text x="242" y="348" font-size="11.5" font-weight="600" fill="#7a5a00">Widerspruch erkannt</text>
  <text x="242" y="363" font-size="11" fill="#7a5a00">Nachtrag_2025.pdf, S. 1 nennt eine Kündigungsfrist von 3 Monaten.</text>
  <rect x="210" y="452" width="560" height="40" rx="20" fill="#ffffff" stroke="#dde3ec"/>
  <text x="232" y="477" font-size="12.5" fill="#8a94a3">Frage zu deinen Dokumenten stellen …</text>
  <circle cx="750" cy="472" r="14" fill="#1f5fd1"/>
  <path d="M744 472h11m-4-4 4 4-4 4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="790" y="512" font-size="9.5" fill="#8a94a3" text-anchor="end">Fiktive Demo-Daten</text>
